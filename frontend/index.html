<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6feb" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Fuel Tracker</title>
    <script>
      // Apply a theme picked with the button before the page is drawn, so it doesn't flash in
      // the other colours first. Without a pick, the style sheet follows the system.
      try {
        var theme = localStorage.getItem('fuel-tracker:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {
        // storage may be blocked
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
