[project]
name = "fuel-tracker"
version = "0.0.0" # not used; the app version comes from the VERSION file
description = "Logs fuel-ups into LubeLogger, with payment data from Pace Drive receipts"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "apprise>=2.0.1",
    "fastapi>=0.118",
    "httpx>=0.28.1",
    "imapclient>=4.1.0",
    "pdfplumber>=0.11.10",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# The receipt generator embeds HTML and long format strings
"tests/fixtures/**" = ["E501"]
